<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จดรายรับรายจ่าย</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="hero">
  <img id="bg" src="header.jpg" alt="">
  <div class="fade"></div>
  <button id="bgBtn" class="glass round" aria-label="เปลี่ยนรูปพื้นหลัง"><i class="ti ti-camera"></i></button>
  <input id="bgFile" type="file" accept="image/*" hidden>
  <div class="glass balance">
    <div class="small" id="balLabel">ทุกบัญชี</div>
    <div class="big" id="balTotal">฿–</div>
  </div>
</header>
<nav class="months">
  <button id="prevM" aria-label="เดือนก่อน"><i class="ti ti-chevron-left"></i> เดือนก่อน</button>
  <span id="monthName"></span>
  <button id="nextM" aria-label="เดือนถัดไป">เดือนหน้า <i class="ti ti-chevron-right"></i></button>
</nav>
<main id="view"><p class="empty">กำลังโหลด…</p></main>
<nav class="tabs">
  <button data-tab="list" class="on"><i class="ti ti-list-details"></i><span>รายการ</span></button>
  <button data-tab="cats"><i class="ti ti-chart-donut-3"></i><span>หมวด</span></button>
  <button data-tab="plan"><i class="ti ti-calendar-dollar"></i><span>แผน</span></button>
  <button data-tab="set"><i class="ti ti-settings"></i><span>ตั้งค่า</span></button>
</nav>
<div id="toast" class="toast" hidden></div>
<script src="config.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
